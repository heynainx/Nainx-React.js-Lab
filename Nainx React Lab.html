<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nainx React Lab – 500+ live React examples you can edit and run</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fb;--pn:#fff;--pn2:#ebe7f8;--ln:#d6cfee;--tx:#1d1736;--mu:#6b6389;--ac:#6d3fe0;--ac2:#d6246f;--cd:#17122b;--ct:#e8e2ff;--st:#f8f7fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110d22;--pn:#1a1433;--pn2:#251d47;--ln:#3a2f66;--tx:#eee9ff;--mu:#a79fce;--ac:#a98bff;--ac2:#ff6fb5;--cd:#0b0817;--st:#2a2150}}
:root[data-theme="dark"]{--bg:#110d22;--pn:#1a1433;--pn2:#251d47;--ln:#3a2f66;--tx:#eee9ff;--mu:#a79fce;--ac:#a98bff;--ac2:#ff6fb5;--cd:#0b0817;--st:#2a2150}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font-weight:800;font-size:23px;letter-spacing:-.03em}
.brand b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu)}
.bar{width:150px;height:8px;background:var(--pn2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.ib{border:1px solid var(--ln);background:var(--pn2);border-radius:10px;padding:6px 10px}
.wrap{flex:1;display:grid;grid-template-columns:370px 1fr;min-height:0}
aside{display:flex;flex-direction:column;min-height:0;background:var(--pn);border-right:1px solid var(--ln)}
.sh{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--ln)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
.chip{flex:none;border:1px solid var(--ln);background:none;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--mu)}
.chip.on{background:var(--ac);color:var(--pn);border-color:var(--ac)}
#list{flex:1;overflow:auto;padding:6px}
.it{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 10px;border:0;border-radius:10px;background:none;content-visibility:auto;contain-intrinsic-size:auto 52px}
.it:hover{background:var(--pn2)}.it.on{background:var(--pn2);box-shadow:inset 3px 0 0 var(--ac)}
.it span{flex:1;font-weight:600;line-height:1.25}
.it small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:2px}
.tick{color:var(--ac);font-weight:800;visibility:hidden}.it.done .tick{visibility:visible}
.empty{padding:30px 14px;text-align:center;color:var(--mu)}
main{position:relative;overflow:auto;min-height:0}
#sp{position:sticky;top:0;height:3px;width:0;background:var(--ac2);z-index:5}
.dt{max-width:900px;margin:0 auto;padding:24px 22px 70px}
.hero{padding:70px 24px;text-align:center;color:var(--mu);max-width:560px;margin:0 auto;line-height:1.55}
.hero h2{font-size:32px;font-weight:800;color:var(--tx);letter-spacing:-.03em;margin-bottom:10px}
h1{font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.035em;margin:6px 0 8px}
.desc{color:var(--mu);margin-bottom:14px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--ln);background:var(--pn);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--pn)}
.btn.ok{border-color:var(--ac);color:var(--ac)}
.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#pv{border-radius:14px;border:1px solid var(--ln);margin-bottom:14px;overflow:hidden}
textarea#ed,pre#hh{width:100%;min-height:230px;background:var(--cd);color:var(--ct);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;font:400 14px/1.6 'JetBrains Mono',monospace;resize:vertical;tab-size:2;white-space:pre;overflow:auto;margin-bottom:12px}
pre#hh{display:none;min-height:0}
.note{font-size:13px;color:var(--mu);margin:-4px 0 12px}
.nv{display:flex;justify-content:space-between;margin-top:18px}
.back{display:none}
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:0;background:var(--ac);color:var(--pn);font-size:18px;opacity:0;pointer-events:none;transition:opacity .25s}
.top.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;font-weight:600;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
 .wrap{display:block;position:relative}aside{height:100%;border:0}
 main{position:absolute;inset:0;transform:translateX(100%);transition:transform .3s;background:var(--bg);z-index:6}
 body.sel main{transform:none}.back{display:inline-flex}
 .prog{margin-left:0;width:100%}.bar{flex:1}
}
@media(prefers-reduced-motion:reduce){main,.bar i{transition-duration:.01ms!important}}
iframe#pv{display:block;width:100%;height:280px;background:#fff;border:1px solid var(--ln);border-radius:14px;margin-bottom:12px}
</style>
</head>
<body>
<header>
 <div class="brand">Nainx <b>React Lab</b></div>
 <div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div><button class="ib" id="rnd" aria-label="Random example" title="Random example">🎲</button><button class="ib" id="th" aria-label="Switch theme">🌓</button></div>
</header>
<div class="wrap">
 <aside>
  <div class="sh">
   <input id="q" type="search" placeholder="Search: hooks, list, form, toggle…" aria-label="Search">
   <div class="chips" id="cats"></div>
  </div>
  <div id="list"></div>
 </aside>
 <main id="main"><div id="sp"></div><div id="dt"><div class="hero"><h2>Pick a React example</h2><p id="hp">Every example runs live. Edit the code and the preview updates.</p></div></div></main>
</div>
<button class="top" id="top" aria-label="Back to top">↑</button>
<div id="toast"></div>
<script>
const q=a=>'['+a.map(x=>"'"+x+"'").join(', ')+']';
const TH='Fruits:Apple,Mango,Kiwi,Grape,Plum;Colors:Red,Blue,Green,Pink,Gold;Cities:Paris,Tokyo,Cairo,Lima,Oslo;Planets:Mars,Venus,Earth,Saturn,Mercury;Languages:Python,Go,Rust,Ruby,Swift;Animals:Cat,Dog,Fox,Owl,Bear;Sports:Tennis,Golf,Rugby,Judo,Cricket;Countries:India,Brazil,Kenya,Japan,Chile;Foods:Pizza,Sushi,Tacos,Pasta,Curry;Drinks:Tea,Coffee,Juice,Milk,Soda;Months:Jan,Feb,Mar,Apr,May;Days:Mon,Tue,Wed,Thu,Fri;Instruments:Piano,Guitar,Drums,Flute,Violin;Vehicles:Car,Bike,Train,Boat,Plane;Flowers:Rose,Lily,Tulip,Daisy,Lotus;Trees:Oak,Pine,Maple,Palm,Birch;Birds:Eagle,Crow,Parrot,Swan,Robin;Fish:Salmon,Tuna,Cod,Trout,Eel;Metals:Iron,Gold,Copper,Zinc,Tin;Gems:Ruby,Opal,Jade,Pearl,Onyx;Subjects:Math,Art,Music,History,Biology;Tools:Hammer,Saw,Drill,Wrench,Pliers;Jobs:Chef,Pilot,Nurse,Artist,Coder;Games:Chess,Ludo,Poker,Tetris,Snake;Books:Dune,Emma,Ulysses,Hamlet,Matilda;Shapes:Circle,Square,Oval,Star,Heart;Snacks:Chips,Nuts,Candy,Cake,Cookie;Weather:Sunny,Rainy,Windy,Foggy,Snowy;Rivers:Nile,Amazon,Ganges,Danube,Thames;Mountains:Everest,K2,Fuji,Alps,Andes;Oceans:Pacific,Atlantic,Indian,Arctic,Southern;Spices:Cumin,Clove,Basil,Mint,Thyme;Vegetables:Carrot,Onion,Peas,Kale,Beet;Dances:Salsa,Tango,Ballet,Disco,Waltz;Fonts:Arial,Roboto,Inter,Lato,Outfit;Browsers:Chrome,Safari,Firefox,Edge,Opera;Editors:VSCode,Vim,Emacs,Atom,Zed;Databases:MySQL,Mongo,Redis,Postgres,SQLite;Clouds:AWS,Azure,GCP,Vercel,Netlify;Frameworks:React,Vue,Angular,Svelte,Solid;Currencies:Dollar,Euro,Yen,Rupee,Peso;Seasons:Spring,Summer,Autumn,Winter,Monsoon;Moods:Happy,Calm,Sad,Excited,Tired'.split(';').map(s=>{const[n,i]=s.split(':');return[n,i.split(',')]});
const W=(a,n,body,pre='')=>`function App() {\n  const items = ${q(a)};\n${pre}  return (\n${body}\n  );\n}`;
const F=[
['List render',(n,a)=>W(a,n,`    <ul>{items.map(i => <li key={i}>{i}</li>)}</ul>`)],
['Search filter',(n,a)=>W(a,n,`    <div>\n      <input placeholder="Search ${n}" value={t} onChange={e => setT(e.target.value)} />\n      <ul>{items.filter(i => i.toLowerCase().includes(t.toLowerCase())).map(i => <li key={i}>{i}</li>)}</ul>\n    </div>`,`  const [t, setT] = useState('');\n`)],
['Sort toggle',(n,a)=>W(a,n,`    <div>\n      <button onClick={() => setAsc(!asc)}>Sort {asc ? 'Z-A' : 'A-Z'}</button>\n      <ul>{sorted.map(i => <li key={i}>{i}</li>)}</ul>\n    </div>`,`  const [asc, setAsc] = useState(true);\n  const sorted = [...items].sort();\n  if (!asc) sorted.reverse();\n`)],
['Select item',(n,a)=>W(a,n,`    <div>\n      {items.map(i => <button key={i} onClick={() => setSel(i)} style={{ fontWeight: sel === i ? 'bold' : 'normal' }}>{i}</button>)}\n      <p>Selected: {sel ?? 'none'}</p>\n    </div>`,`  const [sel, setSel] = useState(null);\n`)],
['Remove item',(n,a)=>W(a,n,`    <div>\n      <ul>{list.map(i => <li key={i}>{i} <button onClick={() => setList(list.filter(x => x !== i))}>✕</button></li>)}</ul>\n      <p>{list.length} left</p>\n    </div>`,`  const [list, setList] = useState(items);\n`)],
['Add item',(n,a)=>W(a,n,`    <div>\n      <input value={v} onChange={e => setV(e.target.value)} placeholder="New ${n}" />\n      <button onClick={() => { if (v) { setList([...list, v]); setV(''); } }}>Add</button>\n      <ul>{list.map((x, k) => <li key={k}>{x}</li>)}</ul>\n    </div>`,`  const [list, setList] = useState(items.slice(0, 2));\n  const [v, setV] = useState('');\n`)],
['Dropdown',(n,a)=>W(a,n,`    <div>\n      <select value={v} onChange={e => setV(e.target.value)}>\n        {items.map(i => <option key={i}>{i}</option>)}\n      </select>\n      <p>You chose {v}</p>\n    </div>`,`  const [v, setV] = useState(items[0]);\n`)],
['Tabs',(n,a)=>W(a,n,`    <div>\n      {items.map(i => <button key={i} onClick={() => setTab(i)} disabled={tab === i}>{i}</button>)}\n      <p>This is the {tab} tab</p>\n    </div>`,`  const [tab, setTab] = useState(items[0]);\n`)],
['Accordion',(n,a)=>W(a,n,`    <div>\n      {items.map((i, k) => (\n        <div key={i}>\n          <button onClick={() => setOpen(open === k ? -1 : k)}>{open === k ? '▾' : '▸'} {i}</button>\n          {open === k && <p>Details about {i}</p>}\n        </div>\n      ))}\n    </div>`,`  const [open, setOpen] = useState(0);\n`)],
['Favorites',(n,a)=>W(a,n,`    <ul>\n      {items.map(i => <li key={i} onClick={() => setFav(fav.includes(i) ? fav.filter(x => x !== i) : [...fav, i])} style={{ cursor: 'pointer' }}>{fav.includes(i) ? '★' : '☆'} {i}</li>)}\n    </ul>`,`  const [fav, setFav] = useState([]);\n`)],
['Carousel',(n,a)=>W(a,n,`    <div>\n      <button onClick={() => setK((k + items.length - 1) % items.length)}>←</button>\n      <b> {items[k]} </b>\n      <button onClick={() => setK((k + 1) % items.length)}>→</button>\n    </div>`,`  const [k, setK] = useState(0);\n`)],
['Show more',(n,a)=>W(a,n,`    <div>\n      <ul>{items.slice(0, c).map(i => <li key={i}>{i}</li>)}</ul>\n      {c < items.length && <button onClick={() => setC(c + 1)}>Show more</button>}\n    </div>`,`  const [c, setC] = useState(2);\n`)]
];
const COL='tomato,orange,gold,limegreen,teal,deepskyblue,royalblue,slateblue,purple,hotpink,crimson,sienna,coral,khaki,salmon,plum,orchid,seagreen,steelblue,indigo,tan,olive,navy,maroon'.split(',');
const EM='Pizza=🍕,Rocket=🚀,Music=🎵,Book=📚,Camera=📷,Coffee=☕,Heart=❤️,Star=⭐,Cloud=☁️,Fire=🔥,Game=🎮,Gift=🎁,Bike=🚲,Plane=✈️,Moon=🌙,Leaf=🍃,Bell=🔔,Key=🔑,Home=🏠,Trophy=🏆'.split(',').map(s=>s.split('='));
const TG='On|Off,Show|Hide,Like|Unlike,Open|Close,Mute|Unmute,Dark|Light,Follow|Unfollow,Lock|Unlock,Play|Pause,Start|Stop'.split(',').map(s=>s.split('|'));
const TX=[['Uppercase','t.toUpperCase()'],['Lowercase','t.toLowerCase()'],['Reversed',"t.split('').reverse().join('')"],['Length','t.length'],['Word count',"t.trim() ? t.trim().split(/\\s+/).length : 0"],['Trimmed','t.trim()'],['Repeated','t.repeat(2)'],['Capitalized','t.charAt(0).toUpperCase() + t.slice(1)'],['Vowel count',"(t.match(/[aeiou]/gi) || []).length"],['Palindrome?',"t === t.split('').reverse().join('') ? 'Yes' : 'No'"]];
const EV='onClick,onDoubleClick,onMouseEnter,onMouseLeave,onMouseDown,onKeyDown,onKeyUp,onChange,onFocus,onBlur,onPaste,onContextMenu'.split(',');
const FI='text,email,password,number,date,color:#6d3fe0,range:50,time,url,tel,search,month'.split(',').map(s=>s.split(':'));
const H=[
['State','Counter with reset',`function App() {\n  const [n, setN] = useState(0);\n  return (\n    <div>\n      <h2>{n}</h2>\n      <button onClick={() => setN(n + 1)}>+1</button>\n      <button onClick={() => setN(n - 1)}>-1</button>\n      <button onClick={() => setN(0)}>Reset</button>\n    </div>\n  );\n}`],
['Effects','Timer with cleanup',`function App() {\n  const [s, setS] = useState(0);\n  useEffect(() => {\n    const id = setInterval(() => setS(x => x + 1), 1000);\n    return () => clearInterval(id);\n  }, []);\n  return <h2>{s} seconds</h2>;\n}`],
['Effects','Window width listener',`function App() {\n  const [w, setW] = useState(window.innerWidth);\n  useEffect(() => {\n    const on = () => setW(window.innerWidth);\n    window.addEventListener('resize', on);\n    return () => window.removeEventListener('resize', on);\n  }, []);\n  return <p>Width: {w}px</p>;\n}`],
['Refs','Focus an input',`function App() {\n  const ref = useRef(null);\n  return (\n    <div>\n      <input ref={ref} placeholder="Type here" />\n      <button onClick={() => ref.current.focus()}>Focus</button>\n    </div>\n  );\n}`],
['Refs','Count renders',`function App() {\n  const [x, setX] = useState(0);\n  const renders = useRef(0);\n  renders.current += 1;\n  return <button onClick={() => setX(x + 1)}>Rendered {renders.current} times</button>;\n}`],
['Reducer','useReducer counter',`function reducer(s, a) {\n  if (a === 'inc') return s + 1;\n  if (a === 'dec') return s - 1;\n  return 0;\n}\nfunction App() {\n  const [n, dispatch] = useReducer(reducer, 0);\n  return (\n    <div>\n      {n} <button onClick={() => dispatch('inc')}>+</button>\n      <button onClick={() => dispatch('dec')}>-</button>\n      <button onClick={() => dispatch('reset')}>0</button>\n    </div>\n  );\n}`],
['Memo','useMemo',`function App() {\n  const [n, setN] = useState(10);\n  const total = useMemo(() => {\n    let s = 0;\n    for (let i = 1; i <= n; i++) s += i;\n    return s;\n  }, [n]);\n  return (\n    <div>\n      <input type="number" value={n} onChange={e => setN(+e.target.value)} />\n      <p>Sum 1..{n} = {total}</p>\n    </div>\n  );\n}`],
['Memo','memo and useCallback',`const Child = memo(({ onPing }) => {\n  console.log('Child rendered');\n  return <button onClick={onPing}>Ping</button>;\n});\nfunction App() {\n  const [n, setN] = useState(0);\n  const ping = useCallback(() => setN(x => x + 1), []);\n  return <div><Child onPing={ping} /> Pings: {n}</div>;\n}`],
['Context','Theme context',`const Theme = createContext('light');\nfunction Label() {\n  const t = useContext(Theme);\n  return <p>Current theme: {t}</p>;\n}\nfunction App() {\n  return <Theme.Provider value="dark"><Label /></Theme.Provider>;\n}`],
['Custom hooks','useToggle',`function useToggle(start = false) {\n  const [on, setOn] = useState(start);\n  return [on, () => setOn(o => !o)];\n}\nfunction App() {\n  const [on, toggle] = useToggle();\n  return <button onClick={toggle}>{on ? 'ON' : 'OFF'}</button>;\n}`],
['Custom hooks','useDebounce',`function useDebounce(v, ms) {\n  const [d, setD] = useState(v);\n  useEffect(() => {\n    const id = setTimeout(() => setD(v), ms);\n    return () => clearTimeout(id);\n  }, [v, ms]);\n  return d;\n}\nfunction App() {\n  const [t, setT] = useState('');\n  const d = useDebounce(t, 500);\n  return <div><input value={t} onChange={e => setT(e.target.value)} /><p>Debounced: {d}</p></div>;\n}`],
['Forms','Submit a form',`function App() {\n  const [name, setName] = useState('');\n  const [sent, setSent] = useState('');\n  const submit = e => { e.preventDefault(); setSent(name); };\n  return (\n    <form onSubmit={submit}>\n      <input value={name} onChange={e => setName(e.target.value)} />\n      <button>Send</button>\n      <p>Sent: {sent}</p>\n    </form>\n  );\n}`],
['Components','Lifting state up',`function Box({ n, onAdd }) { return <button onClick={onAdd}>Box {n}</button>; }\nfunction App() {\n  const [n, setN] = useState(0);\n  return <div><Box n={n} onAdd={() => setN(n + 1)} /><Box n={n} onAdd={() => setN(n + 1)} /></div>;\n}`],
['Async','Loading state',`function App() {\n  const [data, setData] = useState(null);\n  useEffect(() => {\n    setTimeout(() => setData(['One', 'Two', 'Three']), 1000);\n  }, []);\n  if (!data) return <p>Loading…</p>;\n  return <ul>{data.map(d => <li key={d}>{d}</li>)}</ul>;\n}`],
['Apps','Todo list',`function App() {\n  const [todos, setTodos] = useState([]);\n  const [t, setT] = useState('');\n  const add = () => { if (t) { setTodos([...todos, { t, done: false }]); setT(''); } };\n  const flip = i => setTodos(todos.map((x, k) => k === i ? { ...x, done: !x.done } : x));\n  return (\n    <div>\n      <input value={t} onChange={e => setT(e.target.value)} />\n      <button onClick={add}>Add</button>\n      <ul>{todos.map((x, i) => <li key={i} onClick={() => flip(i)} style={{ textDecoration: x.done ? 'line-through' : 'none' }}>{x.t}</li>)}</ul>\n    </div>\n  );\n}`]
];
const E=[...H];
TH.forEach(([n,a])=>F.forEach(([c,f])=>E.push([c,c+': '+n,f(n,a)])));
COL.forEach(c=>E.push(['Styled button','Styled button: '+c,`function App() {\n  const [n, setN] = useState(0);\n  return (\n    <button style={{ background: '${c}', color: '#fff', border: 0, padding: '10px 18px', borderRadius: 8 }} onClick={() => setN(n + 1)}>\n      ${c} clicked {n}\n    </button>\n  );\n}`]));
EM.forEach(([w,e])=>E.push(['Props card','Props card: '+w,`function Card({ title, emoji, children }) {\n  return (\n    <div style={{ border: '1px solid #ccc', borderRadius: 10, padding: 14, width: 200 }}>\n      <h3>{emoji} {title}</h3>\n      <p>{children}</p>\n    </div>\n  );\n}\nfunction App() {\n  return <Card title="${w}" emoji="${e}">This card shows ${w.toLowerCase()}.</Card>;\n}`]));
TG.forEach(([a,b])=>E.push(['Toggle','Toggle: '+a+' / '+b,`function App() {\n  const [on, setOn] = useState(false);\n  return <button onClick={() => setOn(!on)}>{on ? '${a}' : '${b}'}</button>;\n}`]));
TX.forEach(([n,x])=>E.push(['Text input','Text input: '+n,`function App() {\n  const [t, setT] = useState('Hello React');\n  return (\n    <div>\n      <input value={t} onChange={e => setT(e.target.value)} />\n      <p>${n}: {${x}}</p>\n    </div>\n  );\n}`]));
EV.forEach(v=>E.push(['Events','Event: '+v,`function App() {\n  const [msg, setMsg] = useState('Nothing yet');\n  return (\n    <div>\n      <input ${v}={() => setMsg('${v} fired')} placeholder="Interact with me" />\n      <p>{msg}</p>\n    </div>\n  );\n}`]));
FI.forEach(([t,d])=>E.push(['Form inputs','Input type: '+t,`function App() {\n  const [v, setV] = useState('${d||''}');\n  return (\n    <div>\n      <input type="${t}" value={v} onChange={e => setV(e.target.value)} />\n      <p>Value: {v}</p>\n    </div>\n  );\n}`]));
const IT=E.map((a,i)=>({id:'e'+i,cat:a[0],ti:a[1],code:a[2]}));
const $=i=>document.getElementById(i);
const st={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cat='All',q2='',cur=null,done=new Set(st.get('nxr_done','').split(',').filter(Boolean)),tm;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=()=>IT.filter(i=>(cat=='All'||i.cat==cat)&&(!q2||(i.ti+' '+i.cat).toLowerCase().includes(q2)));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)}
function counts(){$('pt').textContent=done.size+' of '+IT.length+' learned';$('pb').style.width=(done.size/IT.length*100)+'%';
 $('hp').textContent=IT.length+' React examples. Each one runs live: edit the code and the preview updates as you type.'}
function chips(){$('cats').innerHTML=['All',...new Set(IT.map(i=>i.cat))].map(c=>`<button class="chip ${cat==c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
function list(){const a=L();
 $('list').innerHTML=a.length?a.map(i=>`<button class="it ${cur&&cur.id==i.id?'on':''} ${done.has(i.id)?'done':''}" data-id="${i.id}"><span>${esc(i.ti)}<small>${esc(i.cat)}</small></span><b class="tick">✓</b></button>`).join(''):'<div class="empty">Nothing matches. Clear the search or pick another topic.</div>';
 $('list').scrollTop=0}
const CDN='https://cdn.jsdelivr.net/npm/';
const SRC='<body style="font:16px system-ui,sans-serif;padding:16px;color:#1d1736"><div id="root"></div><pre id="err" style="color:#c00;white-space:pre-wrap"></pre>'
+'<script src="'+CDN+'react@18.3.1/umd/react.production.min.js"><\/script><script src="'+CDN+'react-dom@18.3.1/umd/react-dom.production.min.js"><\/script><script src="'+CDN+'@babel/standalone@7.24.7/babel.min.js"><\/script>'
+'<script>let R;const E=document.getElementById("err");window.__r=C=>{R&&R.unmount();R=ReactDOM.createRoot(document.getElementById("root"));R.render(React.createElement(C))};addEventListener("error",e=>{E.textContent=e.message});onmessage=e=>{E.textContent="";try{const o=Babel.transform("(()=>{const {useState,useEffect,useRef,useReducer,useMemo,useCallback,useContext,createContext,memo,Fragment}=React;\\n"+e.data+"\\nwindow.__r(App)})()",{presets:["react"]}).code;const s=document.createElement("script");s.textContent=o;document.body.append(s);s.remove()}catch(x){E.textContent=String(x.message||x)}}<\/script>';
const send=()=>{const f=$('pv');if(f&&f.contentWindow&&f.ready)f.contentWindow.postMessage($('ed').value,'*')};
function show(id,push){const i=IT.find(x=>x.id==id);if(!i)return;cur=i;
 if(push)try{history.replaceState(null,'','#'+id)}catch(e){}
 $('dt').innerHTML=`<div class="dt"><button class="btn back" id="bk">← All examples</button>
 <h1>${esc(i.ti)}</h1><p class="desc">${esc(i.cat)}. Edit the React code and the preview updates as you type. The first load needs a moment to fetch React.</p>
 <iframe id="pv" sandbox="allow-scripts" title="Live preview"></iframe>
 <textarea id="ed" spellcheck="false" aria-label="React code"></textarea>
 <div class="row"><button class="btn pri" id="run">▶ Run again</button><button class="btn" id="rs">Reset</button><button class="btn" id="cp">Copy code</button><button class="btn" id="cpf">Copy as file</button><button class="btn ${done.has(id)?'ok':''}" id="lr">${done.has(id)?'✓ Learned':'Mark as learned'}</button></div>
 <p class="note">Components here are written as App. "Copy as file" adds the imports and export for a Vite or Next.js project.</p>
 <div class="nv"><button class="btn" id="pvb">← Previous</button><button class="btn" id="nx">Next →</button></div></div>`;
 $('ed').value=i.code;const f=$('pv');f.onload=()=>{f.ready=1;send()};f.srcdoc=SRC;
 document.body.classList.add('sel');$('main').scrollTop=0;
 document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.id==id))}
function full(){const c=$('ed').value,n=['useState','useEffect','useRef','useReducer','useMemo','useCallback','useContext','createContext','memo'].filter(x=>new RegExp('\\b'+x+'\\b').test(c));return "import { "+n.join(', ')+" } from 'react';\n\n"+c+"\n\nexport default App;\n"}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(m)}catch(e){toast('Copy failed')}a.remove()})}
function nav(d){const a=L(),k=a.findIndex(x=>x.id==cur.id),m=a[k+d];if(m){show(m.id,1);const b=document.querySelector(`.it[data-id="${m.id}"]`);if(b)b.scrollIntoView({block:'nearest'})}else toast(d>0?'That was the last example':'This is the first example')}
function learned(){const i=cur;done.has(i.id)?done.delete(i.id):done.add(i.id);st.set('nxr_done',[...done].join(','));counts();
 const b=$('lr');b.classList.toggle('ok',done.has(i.id));b.textContent=done.has(i.id)?'✓ Learned':'Mark as learned';
 const it=document.querySelector(`.it[data-id="${i.id}"]`);if(it)it.classList.toggle('done',done.has(i.id));toast(done.has(i.id)?'Saved to your progress':'Removed from learned')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.c!==undefined){cat=t.dataset.c;chips();list()}
 else if(t.classList.contains('it'))show(t.dataset.id,1);
 else if(t.id=='run')send();
 else if(t.id=='rs'){$('ed').value=cur.code;send();toast('Code reset')}
 else if(t.id=='cp')copy($('ed').value,'Copied code');
 else if(t.id=='cpf')copy(full(),'Copied as file');
 else if(t.id=='lr')learned();
 else if(t.id=='nx')nav(1);else if(t.id=='pvb')nav(-1);
 else if(t.id=='bk'){document.body.classList.remove('sel');try{history.replaceState(null,'',location.pathname)}catch(e){}}
 else if(t.id=='rnd'){const p=IT[Math.floor(Math.random()*IT.length)];cat='All';chips();list();show(p.id,1);const b=document.querySelector(`.it[data-id="${p.id}"]`);if(b)b.scrollIntoView({block:'center'});toast('Random pick: '+p.ti)}
 else if(t.id=='top')$('main').scrollTop=0;
 else if(t.id=='th'){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';st.set('nxr_theme',d.dataset.theme)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q2=e.target.value.trim().toLowerCase();list()}if(e.target.id=='ed'){clearTimeout(tm);tm=setTimeout(send,500)}});
$('main').addEventListener('scroll',()=>{const m=$('main');$('sp').style.width=(m.scrollTop/Math.max(1,m.scrollHeight-m.clientHeight)*100)+'%';$('top').classList.toggle('on',m.scrollTop>400)});
const th=st.get('nxr_theme','');if(th)document.documentElement.dataset.theme=th;
function route(){const h=location.hash.slice(1);if(IT.some(i=>i.id==h))show(h,0)}
counts();chips();list();addEventListener('hashchange',route);route();
</script>
</body>
</html>
